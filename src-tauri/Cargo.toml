[package]
name = "meeting-pake-ai"
version = "0.1.0"
description = "Meeting Pake AI - perekam meeting tanpa bot"
authors = ["Meeting Pake AI"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "meeting_pake_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-notification = "2.5.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.27.0", features = ["v4"] }
chrono = "0.4.45"
keyring = "4.2.0"
reqwest = { version = "0.13.5", features = ["json", "multipart"] }
wasapi = "0.25.0"
hound = "3.5.1"
tauri-plugin-dialog = "2.8.1"
winreg = "0.56.0"
webrtc-vad = "0.4.0"
strsim = "0.11.1"
async-trait = "0.1.92"
tokio = { version = "1.53.2", features = ["time", "sync", "macros", "rt", "rt-multi-thread", "fs"] }
tauri-plugin-global-shortcut = "2.4.0"
tauri-plugin-autostart = "2.7.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
